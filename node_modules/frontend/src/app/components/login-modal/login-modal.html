@if (isOpen()) {
    <div class="modal-backdrop" (click)="close()" aria-hidden="true"></div>

    <div class="modal" role="dialog" aria-modal="true" aria-label="Sign in or create account">
        <button type="button" class="modal-close" (click)="close()" aria-label="Close">✕</button>

        <div class="modal-brand">
            <img src="/images/logo.png" alt="D'LICIOUS logo" width="60">
            <h2>D'LICIOUS</h2>
            <p>Sign in to complete your order</p>
        </div>

        <!-- Tabs -->
        <div class="tabs" role="tablist">
            <button
                type="button"
                role="tab"
                [class.active]="activeTab() === 'login'"
                (click)="switchTab('login')"
                aria-label="Login tab">
                Login
            </button>
            <button
                type="button"
                role="tab"
                [class.active]="activeTab() === 'register'"
                (click)="switchTab('register')"
                aria-label="Create account tab">
                Create Account
            </button>
        </div>

        <!-- Error banner -->
        @if (error()) {
            <p class="error-banner" role="alert">{{ error() }}</p>
        }

        <!-- Login form -->
        @if (activeTab() === 'login') {
            <form (ngSubmit)="submitLogin()" class="auth-form">
                <label for="login-email">Email</label>
                <input
                    id="login-email"
                    type="email"
                    placeholder="you@example.com"
                    [(ngModel)]="loginEmail"
                    name="loginEmail"
                    autocomplete="email"
                    required>

                <label for="login-password">Password</label>
                <input
                    id="login-password"
                    type="password"
                    placeholder="Your password"
                    [(ngModel)]="loginPassword"
                    name="loginPassword"
                    autocomplete="current-password"
                    required>

                <button type="submit" class="submit-btn" [disabled]="loading()">
                    {{ loading() ? 'Signing in…' : 'Sign In' }}
                </button>

                <p class="switch-hint">
                    No account?
                    <button type="button" class="link-btn" (click)="switchTab('register')">Create one</button>
                </p>
            </form>
        }

        <!-- Register form -->
        @if (activeTab() === 'register') {
            <form (ngSubmit)="submitRegister()" class="auth-form">
                <label for="reg-name">Full Name</label>
                <input
                    id="reg-name"
                    type="text"
                    placeholder="Your name"
                    [(ngModel)]="registerName"
                    name="registerName"
                    autocomplete="name"
                    required>

                <label for="reg-email">Email</label>
                <input
                    id="reg-email"
                    type="email"
                    placeholder="you@example.com"
                    [(ngModel)]="registerEmail"
                    name="registerEmail"
                    autocomplete="email"
                    required>

                <label for="reg-password">Password</label>
                <input
                    id="reg-password"
                    type="password"
                    placeholder="Min. 8 characters"
                    [(ngModel)]="registerPassword"
                    name="registerPassword"
                    autocomplete="new-password"
                    required>

                <label for="reg-confirm">Confirm Password</label>
                <input
                    id="reg-confirm"
                    type="password"
                    placeholder="Repeat password"
                    [(ngModel)]="registerConfirm"
                    name="registerConfirm"
                    autocomplete="new-password"
                    required>

                <button type="submit" class="submit-btn" [disabled]="loading()">
                    {{ loading() ? 'Creating account…' : 'Create Account' }}
                </button>

                <p class="switch-hint">
                    Already have an account?
                    <button type="button" class="link-btn" (click)="switchTab('login')">Sign in</button>
                </p>
            </form>
        }
    </div>
}
