<section id="cart">
        <span class="title">Your Cart</span>
        <h2>
            Review Your
            <span class="red">Order</span>
        </h2>
        <div class="cart-wrapper">
            <div class="cart-items empty" aria-live="polite">
                <p class="empty-cart-message">Your cart is empty. Add something delicious to get started.</p>
            </div>
            <aside class="cart-summary">
                <h3>Cart Summary</h3>
                <div class="cart-summary-row subtotal-row hidden">
                    <span>Subtotal</span>
                    <span class="cart-subtotal">R 0.00</span>
                </div>
                <div class="cart-summary-row">
                    <span>Delivery</span>
                    <span class="delivery-fee">R 0.00</span>
                </div>
                <div class="cart-summary-row">
                    <span>Tax</span>
                    <span>R 0.00</span>
                </div>
                <div class="cart-summary-row total-row">
                    <span>Total</span>
                    <span class="cart-total">R 0.00</span>
                </div>
                <button class="checkout-button" type="button" disabled>Checkout</button>
            </aside>
        </div>
    </section>
