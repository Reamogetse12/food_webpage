<header>
    <div class="logo">
        <img src="/images/logo.png" alt="logo" width="150px"><h3>D'LICIOUS</h3>
        <h5><span class="red">Fast Food</span></h5>
    </div>
    <nav>
        <a href="#home">Home</a>
        <a href="#our-story">About</a>
        <a href="#our-menu">Menu</a>
        <a href="#reservations">Reservation</a>
        <a href="#contacts">Contacts</a>
    </nav>
    <div class="header-actions">
        <button type="button" class="cart-btn" (click)="cartToggled.emit()" aria-label="Open cart">
            🛒
            @if (cartCount() > 0) {
                <span class="cart-badge">{{ cartCount() }}</span>
            }
        </button>
        @if (isLoggedIn()) {
            <span class="nav-user">👤 {{ user()?.name }}</span>
            <button type="button" class="logout-nav-btn" (click)="logout()">Log out</button>
        }
        <button type="button" (click)="scrollTo('ordering-menu')">Order now</button>
    </div>
</header>
